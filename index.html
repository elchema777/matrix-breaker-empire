<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050508" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>⬡ Matrix Breaker Empire</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      body{background:#050508;color:#F0F0F0;font-family:'Syne',sans-serif;-webkit-tap-highlight-color:transparent;}
      button{font-family:'Syne',sans-serif;}
      ::-webkit-scrollbar{width:3px;}
      ::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.2);border-radius:2px;}
      .btn-primary{background:linear-gradient(135deg,#FFD700,#FF8C00);color:#050508;border:none;border-radius:10px;padding:13px 20px;font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;}
      .btn-secondary{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#F0F0F0;padding:11px 16px;font-family:'Orbitron',monospace;font-size:10px;font-weight:600;letter-spacing:1px;cursor:pointer;}
      .btn-danger{background:rgba(255,59,59,0.12);border:1px solid rgba(255,59,59,0.35);border-radius:10px;color:#FF6B6B;padding:11px 16px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
